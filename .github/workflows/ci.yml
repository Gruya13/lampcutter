name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          # Pun istorija: test-lock proverava zaključane testove preko git
          # revizije (git show <rev>:<path>), shallow clone bi ga oborio.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instaliraj zavisnosti
        run: |
          uv sync --group dev --extra gui
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check src scripts
      - name: Qt sistemske biblioteke (offscreen)
        # pytest-qt se učitava za svaki pytest poziv; bez libEGL PySide6 ne može
        # da se importuje i ceo test korak pada sa "INTERNALERROR ... libEGL.so.1".
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Zaključani test setovi (mreža blokirana)
        run: |
          for suite in phase0a phase0b phase1 phase2 phase3 phase4 brush; do
            uv run --no-sync python scripts/run_cases.py "tests/cases/$suite.json" \
                -- --disable-socket --allow-unix-socket
          done